name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  game:
    name: Lint, test, build (game/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: npm run sync-data
      - run: npm run lint
      - run: npm run format:check
      - run: npm run docs-check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
